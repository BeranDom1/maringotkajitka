services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: maringotkajitka:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      MARINGOTKA_ADMIN_PASSWORD: "${MARINGOTKA_ADMIN_PASSWORD:?Set MARINGOTKA_ADMIN_PASSWORD in .env}"
      TZ: Europe/Prague
    volumes:
      - gallery-data:/var/www/html/data
      - gallery-uploads:/var/www/html/uploads/gallery
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777

volumes:
  gallery-data:
  gallery-uploads:
